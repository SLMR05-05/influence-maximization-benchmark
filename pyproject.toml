[build-system]
requires = ["setuptools>=64.0", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "im_research"
version = "0.1.0"
description = "A High-Performance Research & Benchmarking Platform for Metaheuristic Algorithms in Influence Maximization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Khanh", email = "research@example.com"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "tqdm>=4.66.0",
    "customtkinter>=5.2.0",
    "pybind11>=2.12.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
im-bench = "im_research.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

